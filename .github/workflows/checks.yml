name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Build checked helper and offline mock
        shell: pwsh
        run: |
          ./dashboard/Build-RadioControl.ps1
          ./dashboard/Build-RadioControl.ps1 -TestFixture
      - name: Run offline tests
        run: python -m unittest discover -s dashboard -p "test_*.py" -v
      - name: Verify entry point
        run: python launch.py --version
